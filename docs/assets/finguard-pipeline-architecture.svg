<svg width="680" height="880" viewBox="0 0 680 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fgTitle fgDesc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="fgTitle">FinGuard end-to-end fraud detection pipeline</title>
  <desc id="fgDesc">Three sources feed Bronze, Silver, Gold medallion layers in Databricks, which then output to email alerts and a dashboard.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <style>
    .box-fill-source   { fill: #0C447C; stroke: #4788C4; }
    .box-fill-ingest   { fill: #085041; stroke: #31876F; }
    .box-fill-medal    { fill: #3C3489; stroke: #7770D1; }
    .box-fill-medal-hl { fill: #3C3489; stroke: #A49FF0; }
    .box-fill-out      { fill: #712B13; stroke: #C56A43; }
    .container-fill    { fill: #444441; stroke: #898781; }
    .container-dashed  { fill: none; stroke: #898781; stroke-dasharray: 5 5; }
    .txt-title  { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 500; }
    .txt-sub    { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 12px; font-weight: 500; }
    .txt-head   { font-family: -apple-system, "Segoe UI", Arial, sans-serif; font-size: 14px; font-weight: 500; }
    .txt-src    { fill: #FFFFFF; }
    .txt-src-sub{ fill: #D6E8FA; }
    .txt-ing    { fill: #FFFFFF; }
    .txt-med    { fill: #FFFFFF; }
    .txt-med-sub{ fill: #E2E0FF; }
    .txt-out    { fill: #FFFFFF; }
    .txt-out-sub{ fill: #FFE0D2; }
    .txt-head-c { fill: #F0EFEC; }
    .arrow-line { stroke: #C3C2BB; stroke-width: 1.5; fill: none; }
  </style>

  <!-- ===================== SECTION 1: Data generation and ingestion ===================== -->
  <g>
    <rect class="container-fill" x="40" y="30" width="600" height="150" rx="16" stroke-width="0.5"/>
    <text class="txt-head txt-head-c" x="60" y="55">Data generation and ingestion</text>
  </g>

  <!-- Row 1: sources -->
  <g>
    <rect class="box-fill-source" x="60" y="75" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="txt-title txt-src" x="145" y="93" text-anchor="middle" dominant-baseline="central">Kafka producer</text>
    <text class="txt-sub txt-src-sub" x="145" y="111" text-anchor="middle" dominant-baseline="central">Transaction generator</text>
  </g>

  <g>
    <rect class="box-fill-source" x="255" y="75" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="txt-title txt-src" x="340" y="93" text-anchor="middle" dominant-baseline="central">Fraud watchlist</text>
    <text class="txt-sub txt-src-sub" x="340" y="111" text-anchor="middle" dominant-baseline="central">File generator</text>
  </g>

  <g>
    <rect class="box-fill-source" x="450" y="75" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="txt-title txt-src" x="535" y="93" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
    <text class="txt-sub txt-src-sub" x="535" y="111" text-anchor="middle" dominant-baseline="central">Customer master data</text>
  </g>

  <!-- arrows source -> ingest -->
  <line class="arrow-line" x1="145" y1="131" x2="145" y2="164" marker-end="url(#arrow)"/>
  <text class="txt-sub" x="145" y="150" text-anchor="middle" fill="#A9AAA5">Publish txns</text>

  <line class="arrow-line" x1="340" y1="131" x2="340" y2="164" marker-end="url(#arrow)"/>
  <text class="txt-sub" x="340" y="150" text-anchor="middle" fill="#A9AAA5">JSON feed</text>

  <line class="arrow-line" x1="535" y1="131" x2="535" y2="164" marker-end="url(#arrow)"/>
  <text class="txt-sub" x="535" y="150" text-anchor="middle" fill="#A9AAA5">Historical data</text>

  <!-- Row 2: ingestion mechanisms -->
  <g>
    <rect class="box-fill-ingest" x="60" y="164" width="170" height="44" rx="8" stroke-width="0.5"/>
    <text class="txt-title txt-ing" x="145" y="186" text-anchor="middle" dominant-baseline="central">Confluent Kafka topic</text>
  </g>

  <g>
    <rect class="box-fill-ingest" x="255" y="164" width="170" height="44" rx="8" stroke-width="0.5"/>
    <text class="txt-title txt-ing" x="340" y="186" text-anchor="middle" dominant-baseline="central">Auto Loader</text>
  </g>

  <g>
    <rect class="box-fill-ingest" x="450" y="164" width="170" height="44" rx="8" stroke-width="0.5"/>
    <text class="txt-title txt-ing" x="535" y="186" text-anchor="middle" dominant-baseline="central">Silver enrichment</text>
  </g>

  <!-- ===================== SECTION 2: Databricks streaming and medallion processing ===================== -->
  <rect class="container-dashed" x="40" y="230" width="600" height="340" rx="16" stroke-width="0.5"/>
  <text class="txt-head txt-head-c" x="60" y="255">Databricks streaming and medallion processing</text>

  <!-- arrows ingest -> bronze -->
  <line class="arrow-line" x1="145" y1="208" x2="145" y2="265" marker-end="url(#arrow)"/>
  <text class="txt-sub" x="145" y="230" text-anchor="middle" fill="#A9AAA5">Structured streaming</text>

  <line class="arrow-line" x1="340" y1="208" x2="340" y2="265" marker-end="url(#arrow)"/>
  <text class="txt-sub" x="340" y="230" text-anchor="middle" fill="#A9AAA5">Cloud files ingestion</text>

  <!-- Bronze layer -->
  <g>
    <rect class="box-fill-medal" x="60" y="265" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="txt-title txt-med" x="145" y="283" text-anchor="middle" dominant-baseline="central">Bronze layer</text>
    <text class="txt-sub txt-med-sub" x="145" y="301" text-anchor="middle" dominant-baseline="central">Raw transactions</text>
  </g>

  <g>
    <rect class="box-fill-medal" x="255" y="265" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="txt-title txt-med" x="340" y="283" text-anchor="middle" dominant-baseline="central">Bronze layer</text>
    <text class="txt-sub txt-med-sub" x="340" y="301" text-anchor="middle" dominant-baseline="central">Fraud watchlist</text>
  </g>

  <!-- arrows bronze -> silver -->
  <line class="arrow-line" x1="145" y1="321" x2="145" y2="364" marker-end="url(#arrow)"/>
  <text class="txt-sub" x="145" y="345" text-anchor="middle" fill="#A9AAA5">Cleaning and parsing</text>

  <line class="arrow-line" x1="340" y1="321" x2="340" y2="364" marker-end="url(#arrow)"/>
  <text class="txt-sub" x="340" y="345" text-anchor="middle" fill="#A9AAA5">Dedup and schema</text>

  <!-- Silver layer -->
  <g>
    <rect class="box-fill-medal" x="60" y="364" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="txt-title txt-med" x="145" y="382" text-anchor="middle" dominant-baseline="central">Silver layer</text>
    <text class="txt-sub txt-med-sub" x="145" y="400" text-anchor="middle" dominant-baseline="central">Cleaned transactions</text>
  </g>

  <g>
    <rect class="box-fill-medal" x="255" y="364" width="170" height="56" rx="8" stroke-width="0.5"/>
    <text class="txt-title txt-med" x="340" y="382" text-anchor="middle" dominant-baseline="central">Silver layer</text>
    <text class="txt-sub txt-med-sub" x="340" y="400" text-anchor="middle" dominant-baseline="central">Refined watchlist</text>
  </g>

  <!-- joins into Gold -->
  <path class="arrow-line" d="M145 420 V450 H340 V478" marker-end="url(#arrow)"/>
  <path class="arrow-line" d="M340 420 V478" marker-end="url(#arrow)"/>

  <text class="txt-sub" x="245" y="445" text-anchor="middle" fill="#A9AAA5">Real-time join and aggregation</text>

  <!-- Gold layer -->
  <g>
    <rect class="box-fill-medal-hl" x="255" y="478" width="170" height="56" rx="8" stroke-width="1"/>
    <text class="txt-title txt-med" x="340" y="496" text-anchor="middle" dominant-baseline="central">Gold layer</text>
    <text class="txt-sub txt-med-sub" x="340" y="514" text-anchor="middle" dominant-baseline="central">Fraud card and high value</text>
  </g>

  <!-- Gold -> outputs -->
  <line class="arrow-line" x1="290" y1="534" x2="240" y2="620" marker-end="url(#arrow)"/>
  <text class="txt-sub" x="230" y="555" text-anchor="end" fill="#A9AAA5">Trigger email sink</text>

  <line class="arrow-line" x1="390" y1="534" x2="440" y2="620" marker-end="url(#arrow)"/>
  <text class="txt-sub" x="450" y="555" text-anchor="start" fill="#A9AAA5">Aggregate metrics</text>

  <!-- ===================== SECTION 3: Alerting and analytics ===================== -->
  <rect class="container-dashed" x="40" y="600" width="600" height="130" rx="16" stroke-width="0.5"/>
  <text class="txt-head txt-head-c" x="60" y="625">Alerting and analytics</text>

  <g>
    <rect class="box-fill-out" x="140" y="640" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="txt-title txt-out" x="230" y="658" text-anchor="middle" dominant-baseline="central">Email notifier</text>
    <text class="txt-sub txt-out-sub" x="230" y="676" text-anchor="middle" dominant-baseline="central">Gmail SMTP alerts</text>
  </g>

  <g>
    <rect class="box-fill-out" x="360" y="640" width="180" height="56" rx="8" stroke-width="0.5"/>
    <text class="txt-title txt-out" x="450" y="658" text-anchor="middle" dominant-baseline="central">Lakeview dashboard</text>
    <text class="txt-sub txt-out-sub" x="450" y="676" text-anchor="middle" dominant-baseline="central">Refreshes every minute</text>
  </g>
</svg>